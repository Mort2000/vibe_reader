[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibe-reader-verify"
version = "0.1.0"
description = "Independent black-box system verification toolkit for Vibe Reader"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[project.scripts]
vibe-verify = "vibe_verify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vibe_verify"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["vibe_verify"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
