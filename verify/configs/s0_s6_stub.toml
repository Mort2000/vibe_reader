suite = "core"
scenarios = [
  "S0_environment_connectivity",
  "S1_import_book",
  "S2_continuous_reading_comments",
  "S3_fast_scroll",
  "S4_context_compaction",
  "S5_direct_chat",
  "S6_followup_chat",
]
target_url = "http://127.0.0.1:8000"
artifact_root = "verify_runs"
corpus = "corpus/hongloumeng_manifest.toml"

[profile]
name = "r1_a4_stub"
llm_mode = "stub"
audit = false
backend_agent_evidence = false

[profile.stub]
name = "r1_a4_stub"

[profile.user]
reading_paragraphs_per_second = 4.0
page_delay_s = 0.25
patience_s = 30.0
poll_interval_s = 0.1

[profile.budget]
max_calls = 80
max_tokens = 1000000
max_duration_s = 900.0
max_cost_usd = 0.0

[params]
read_batches = 8
read_batch_size = 4
min_comment_windows = 1
post_compaction_comment_windows = 1
min_chat_turns = 2
s6_chat_turns = 8
chat_history_recent_turns = 6
fast_scroll_offsets = [1, 2, 4, 6]
max_wait_comment_s = 60.0
max_wait_compaction_s = 120.0

[backend]
command = "uv run vibe-reader"
cwd = "../backend"
config_file = "configs/backend_r1_a4_stub.toml"
ready_path = "/api/health"
ready_timeout_s = 30.0
reset_data_dir = true

[backend.env]
VIBE_READER_DATA_DIR = "/tmp/vibe_reader_verify_s0_s6_stub"
VIBE_READER_VERIFY_MODE = "1"
VIBE_READER_OBSERVABILITY_ENABLED = "0"
