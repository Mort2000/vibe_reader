# Vibe Reader Mini · Verification Corpus Manifest
#
# Each book entry defines a real epub used in system verification.
# sha256 must match the actual file to ensure reproducibility.
# license must be declared to confirm authorization for test usage.
#
# Place epub files in: tests/corpus/books/

[[books]]
alias = "genius_prince"
path = "tests/corpus/books/long_cn_novel_01.epub"
language = "zh-CN"
license = "public-domain-or-authorized"
sha256 = "5b8a4e552e42c7769da068ec8eec87e760a022a11bcfa34c155b55d81e0b11a4"
expected_min_chapters = 50
expected_min_paragraphs = 3000
expected_min_chars = 500000

[[books.probes]]
name = "early"
# chapter 0 is front matter (cover/copyright); all scenarios read in chapter 1
chapter_idx = 1
paragraph_idx = 20

[[books.probes]]
name = "chat_live"
# After typical S4 compaction reclaims P0–179; S5/S6 chat must land in active L2.
chapter_idx = 1
paragraph_idx = 200

[[books.probes]]
name = "middle"
chapter_idx = 1
paragraph_idx = 120

[[books.probes]]
name = "long_context"
# Start in chapter 1; S4 advances forward and crosses chapters as needed.
chapter_idx = 1
paragraph_idx = 20
requires_context_tokens_gte = 100000

[[books.probes]]
name = "happy_path_current"
start_chapter_idx = 1
start_paragraph_idx = 0
chapter_idx = 1
paragraph_idx = 275
real_llm = true
requires_compaction = true
requires_context_tokens_gte = 100000
test_compaction_trigger_tokens = 24000
test_compaction_min_source_tokens = 5000
test_compaction_min_source_paragraphs = 80
max_real_input_tokens = 64000
