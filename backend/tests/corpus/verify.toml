[target]
base_url = "http://127.0.0.1:8000"
data_dir = "/tmp/vibe_reader_verify"

[llm]
mode = "stub"
stub_profile = "mvp_default"
temperature = 0
timeout_s = 120

[llm_stub.aimock]
enabled = true
version = "1.27.1"
host = "127.0.0.1"
port = 4010
strict = true
metrics = true
fixture_dir = "tests/system_verify/llm_stub/aimock/fixtures"
profile_dir = "tests/system_verify/llm_stub/aimock/profiles"
seed = 20260522
startup_timeout_s = 20
api_key = "aimock-test-key"
model = "deepseek-v4-flash"

[real_llm]
base_url = ""
api_key_env = "VIBE_READER_LLM_API_KEY"
model = "deepseek-v4-flash"

[param_set]
default = "mvp"
dir = "param_sets"

[suite_defaults]
smoke = "mvp"
mvp = "mvp"
real-happy-path = "r1_a2_real"

[run]
suite = "mvp"
seed = 20260522

[metrics]
collect_otel = true
collect_logfire = true
collect_sse_events = true
collect_provider_usage = false

[audit]
enabled = true
level = "agent_interaction"
write_markdown_report = true
markdown_original_text_mode = "range_edge_excerpt"
edge_paragraph_max_chars = 800
write_prompt_markdown = true
write_context_sidecars = true
redact_secrets = true
sample_comments_per_window = 3
sample_chat_turns_per_probe = 2
include_prompt_manifest = true
include_full_prompt = false
include_original_excerpts = true

[comment_density]
soft_min = 0.05
stat_window_paragraphs = 400

[app.reader]
lookahead_paragraphs = 80

[app.window_l1]
focus_max_tokens = 24000
min_focus_paragraphs = 80
max_focus_paragraphs = 200
trigger_advance_ratio = 0.88
comment_density_soft_min = 0.05
comment_density_stat_window_paragraphs = 400

[app.context_l3]
preflight_trigger_input_tokens = 24000
max_completed_l2_chunks_before_compaction = 3
min_completed_l2_chunks_before_compaction = 3

[app.context_l2]
target_chunk_tokens = 7000
min_chunk_tokens = 5000
max_chunk_tokens = 9000
max_live_original_tokens = 24000
min_live_chunks_after_compaction = 2
preferred_live_chunks_after_compaction = 3

[context]
provider_context_limit_tokens = 1000000
attention_target_input_tokens = 128000
normal_target_input_tokens = 112000
compression_target_input_tokens = 128000
emergency_input_cap_tokens = 160000
target_l2_chunk_tokens = 24000
max_context_jump_chars = 24000
