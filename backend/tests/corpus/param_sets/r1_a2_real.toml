name = "r1_a2_real"
llm_mode = "real"

progress_step_delay_ms = 100
read_batch_size = 120
compaction_advance_batch_size = 120
max_wait_comment_window_s = 300
max_wait_compaction_s = 600
max_wait_chat_s = 120

[long_flow]
require_compaction = true
test_compaction_trigger_tokens = 24000
test_compaction_min_source_tokens = 16000
test_compaction_min_source_paragraphs = 120
min_comment_windows = 2
min_chat_turns = 1
reading_stop_mode = "cross_chapter"
post_compaction_comment_windows = 3

[budget]
enforce = true
track_usage = true
max_calls = 15
max_input_tokens_per_call = 128000
max_output_tokens_per_call = 4096
max_total_cost_usd = 3.00

[assertions]
strict_done_without_comments = false
require_compaction_audit_real = false
allow_probe_without_real_llm_flag = false
